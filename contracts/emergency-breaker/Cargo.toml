[package]
name = "emergency-breaker"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Multi-sig emergency circuit breaker contract for Soroban — M-of-N freeze with timelock unpause"
license = "Apache-2.0"
repository = "https://github.com/agnesnaomiolim-cloud/Stellar-K8s"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Ed25519 signature verification — no_std compatible
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
