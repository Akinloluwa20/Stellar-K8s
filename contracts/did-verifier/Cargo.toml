[package]
name = "did-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"

#[dev-dependencies]
soroban-sdk = { version = "1.0", features = ["testutils"] }
edr5519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "std"] }
