[package]
name = "proxy-controller-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end upgrade tests for proxy-controller, run against real compiled mock_v1/mock_v2 Wasm"

[dependencies]

[dev-dependencies]
soroban-sdk = { version = "23.5.0", features = ["testutils"] }
# soroban-env-host 23.0.1 depends on `ed25519-dalek = ">=2.0.0"` (an
# open-ended range). Left unpinned, Cargo resolves that to ed25519-dalek
# 3.x, which upgrades its `rand_core` major version and no longer
# implements the RNG trait soroban-env-host's own test utilities expect,
# breaking the build. Pin to the 2.x line that is actually compatible.
ed25519-dalek = "=2.2.0"
