[package]
name = "example-validator"
version = "0.1.0"
edition = "2021"
description = "Example StellarNode validation plugin for the Wasm webhook"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Enable Link Time Optimization
strip = true         # Strip debug symbols
panic = "abort"      # Abort on panic for security
codegen-units = 1    # Better optimization

# Security-hardened profile for production WASM modules
[profile.production]
inherits = "release"
opt-level = "z"      # Maximum size optimization for WASM
lto = "fat"          # Aggressive LTO
panic = "abort"      # Never unwind
strip = "symbols"    # Strip all symbols
