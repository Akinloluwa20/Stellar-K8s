[package]
name = "image-registry-validator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Enable Link Time Optimization
codegen-units = 1     # Reduce number of codegen units to increase optimizations
panic = "abort"       # Abort on panic for security
strip = true          # Strip debug symbols from binary

# Security-hardened profile for production WASM modules  
[profile.production]
inherits = "release"
opt-level = "z"       # Maximum size optimization for WASM
lto = "fat"           # Aggressive link-time optimization
panic = "abort"       # Never unwind in production
strip = "symbols"     # Strip all symbols for minimal size
codegen-units = 1     # Single unit for maximum optimization
