apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soroban-rpc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: soroban
  source:
    repoURL: https://github.com/agnesnaomiolim-cloud/Stellar-K8s
    path: charts/soroban-rpc
    targetRevision: HEAD
    helm:
      valueFiles: []
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
