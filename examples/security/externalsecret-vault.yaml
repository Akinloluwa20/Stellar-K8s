# ESO SecretStore using Vault Kubernetes auth. The Vault policy must grant read
# only to the single path below; do not use a ClusterSecretStore for one node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: stellar-mainnet
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secrets
  namespace: stellar-mainnet
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: stellar-mainnet-validator
          serviceAccountRef:
            name: external-secrets
