# ESO SecretStore using AWS Secrets Manager and IRSA. The operator creates the
# ExternalSecret named in StellarNode.spec.validatorConfig.seedSecretSource.
# Replace the role ARN and namespace before applying.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: stellar-mainnet
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            audiences:
              - sts.amazonaws.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: stellar-mainnet
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/stellar-seed-read
