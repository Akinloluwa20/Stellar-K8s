[workspace]

[package]
name = "optimized-sample"
version = "0.1.0"
edition = "2021"
description = "Soroban contract demonstrating WASM gas and storage optimizations"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
