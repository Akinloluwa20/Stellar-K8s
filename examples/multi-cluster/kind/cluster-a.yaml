# kind config for Cluster A (Primary)
#
# Usage:
#   kind create cluster --name cluster-a --config kind/cluster-a.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cluster-a
nodes:
  - role: control-plane
  - role: worker
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
