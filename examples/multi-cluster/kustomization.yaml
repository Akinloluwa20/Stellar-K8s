apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-cluster-system
resources:
  - namespace.yaml
  - service-account.yaml
  - network-policy.yaml
  - statefulset.yaml
  - service.yaml
  - external-dns.yaml
commonLabels:
  app.kubernetes.io/component: validator
  app.kubernetes.io/part-of: multi-cluster
  app.kubernetes.io/managed-by: kustomize
images:
  - name: validator
    newName: ghcr.io/example/validator
    newTag: v1.0.0
