suite: deployment
templates:
  - templates/deployment.yaml

tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-stellar-operator
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/stellar/stellar-k8s:0.1.0

  - it: uses custom replica count
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: uses fullnameOverride when set
    set:
      fullnameOverride: my-operator
    asserts:
      - equal:
          path: metadata.name
          value: my-operator

  - it: uses custom image tag
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/stellar/stellar-k8s:v1.2.3

  - it: sets imagePullPolicy
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: includes prometheus pod annotations by default
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9090"

  - it: renders run subcommand and REST_API_PORT when enabled
    set:
      operator.restApiEnabled: true
      operator.restApiPort: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: run
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REST_API_PORT
            value: "9090"

  - it: omits REST_API_PORT when rest api disabled
    set:
      operator.restApiEnabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REST_API_PORT
            value: "8080"
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: run

  - it: omits profiling env when profiling disabled
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REST_API_PROFILING_ENABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: profiling-tmp
            mountPath: /tmp
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: sets profiling env when operator.profiling.enabled
    set:
      operator.restApiEnabled: true
      operator.profiling.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REST_API_PROFILING_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MALLOC_CONF
            value: "prof:true,prof_active:true,lg_prof_sample:19"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: profiling-tmp
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: profiling-tmp
            mountPath: /tmp
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: exposes http and metrics ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: has liveness probe on /livez
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http

  - it: has readiness probe on /readyz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: has startup probe on /healthz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http

  - it: applies pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532

  - it: applies container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: sets resource limits and requests
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: sets log level arg
    set:
      operator.logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --log-level=debug

  - it: adds watch-namespace arg when configured
    set:
      operator.watchNamespace: stellar-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespace=stellar-system

  - it: has correct selector labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: stellar-operator
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: uses imagePullSecrets when set
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-registry-secret

  - it: applies extraAnnotations to deployment metadata
    set:
      extraAnnotations:
        custom.io/env: production
        custom.io/team: platform
    asserts:
      - equal:
          path: metadata.annotations["custom.io/env"]
          value: production
      - equal:
          path: metadata.annotations["custom.io/team"]
          value: platform

  - it: applies extraAnnotations to pod spec template metadata
    set:
      extraAnnotations:
        custom.io/env: production
        custom.io/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["custom.io/env"]
          value: production
      - equal:
          path: spec.template.metadata.annotations["custom.io/team"]
          value: platform

  - it: merges podAnnotations and extraAnnotations in pod spec
    set:
      extraAnnotations:
        custom.io/env: production
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["custom.io/env"]
          value: production
