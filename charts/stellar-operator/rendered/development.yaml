apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: stellar-operator-0.1.0
  name: stellar-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: stellar-operator
      app.kubernetes.io/name: stellar-operator
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/instance: stellar-operator
        app.kubernetes.io/name: stellar-operator
    spec:
      containers:
      - args:
        - run
        - --log-level=debug
        - --namespace=stellar-system
        - --watch-namespace=default
        env:
        - name: STELLAR_OPERATOR_CONFIG
          value: /etc/stellar-operator/config.yaml
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAMESPACE
          value: stellar-system
        - name: REST_API_PORT
          value: '9090'
        image: ghcr.io/stellar/stellar-k8s:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: stellar-operator
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/stellar-operator
          name: operator-config
          readOnly: true
      - command:
        - /stellar-sidecar
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: stellar-operator
        - name: RUST_LOG
          value: debug
        image: ghcr.io/stellar/stellar-k8s:latest
        imagePullPolicy: IfNotPresent
        name: crash-analyzer
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: stellar-operator
      volumes:
      - configMap:
          name: stellar-operator-defaults
        name: operator-config
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: stellar-operator-0.1.0
  name: stellar-operator-test
  namespace: stellar-system
spec:
  containers:
  - command:
    - /bin/sh
    - -c
    - "set -e\necho \"=== Stellar Operator Helm Test ===\"\n\n# Test 1: Operator deployment is ready\necho \"Test 1: Checking operator deployment...\"\nkubectl wait --for=condition=available --timeout=60s \\\n  deployment/stellar-operator \\\n  -n stellar-system\necho \"✓ Operator deployment is ready\"\n\n# Test 2: CRDs are installed\necho \"Test 2: Checking CRD installation...\"\nkubectl get crd stellarnodes.stellar.org\necho \"✓ StellarNode CRD is installed\"\n\n# Test 3: Service is accessible\necho \"Test 3: Checking service accessibility...\"\nkubectl get service stellar-operator -n stellar-system\necho \"✓ Operator service exists\"\n\n# Test 4: Metrics endpoint is responding\necho \"Test 4: Checking metrics endpoint...\"\nPOD_NAME=$(kubectl get pods -n stellar-system -l app.kubernetes.io/name=stellar-operator -o jsonpath='{.items[0].metadata.name}')\nkubectl exec -n stellar-system $POD_NAME -- wget -q -O- http://localhost:9090/metrics | grep -q \"stellar_\"\necho \"✓ Metrics endpoint is responding\"\n\n# Test 5: RBAC permissions\necho \"Test 5: Checking RBAC permissions...\"\nkubectl auth can-i get stellarnodes --as=system:serviceaccount:stellar-system:stellar-operator\nkubectl auth can-i create pods --as=system:serviceaccount:stellar-system:stellar-operator\necho \"✓ RBAC permissions are configured\"\n\n# Test 6: Webhook configuration (if enabled)\necho \"Test 6: Checking admission webhook...\"\nkubectl get validatingwebhookconfigurations | grep stellar\necho \"✓ Admission webhook is configured\"\n\necho \"\"\necho \"=== All Tests Passed ===\"\necho \"✓ Stellar Operator is healthy and ready\"\n"
    image: ghcr.io/stellar/stellar-k8s:latest
    imagePullPolicy: Always
    name: test
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  restartPolicy: Never
  securityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
  serviceAccountName: stellar-operator
