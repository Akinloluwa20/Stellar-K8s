name: Contract Tests

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contract-tests.yml'

concurrency:
  group: contract-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  royalty-splitter:
    name: Royalty Splitter (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/royalty-splitter
    steps:
      - uses: actions/checkout@v7

      # Toolchain + cache come from the shared composite; inlining
      # dtolnay/rust-toolchain is rejected by the CI Reliability Test
      # (see .github/CI_COMMANDS.md, issue #1175).
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-contracts-royalty-splitter"
          components: "rustfmt clippy"

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build deployable WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run tests (unit + integration)
        run: cargo test
